services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    command: bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      STORAGE_DIR: /data/storage
      TMP_DIR: /data/tmp
    volumes:
      - ./:/code
      - storage:/data
    working_dir: /code
    depends_on:
      - db
    ports:
      - "8000:8000"
volumes:
  pgdata:
  storage: